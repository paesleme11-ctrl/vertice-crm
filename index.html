<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, sendPasswordResetEmail, signOut } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js';
import { getFirestore, doc, getDoc, getDocs, collection, addDoc, updateDoc, deleteField, deleteDoc, onSnapshot, query, orderBy, limit, where, getCountFromServer, getAggregateFromServer, sum, serverTimestamp, startAfter } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: 'AIzaSyAtswX9YSlKRgPX2YxlarLDv74KODfEUTQ',
  authDomain: 'vertice-crm-da863.firebaseapp.com',
  projectId: 'vertice-crm-da863',
  storageBucket: 'vertice-crm-da863.firebasestorage.app',
  messagingSenderId: '647721198113',
  appId: '1:647721198113:web:e8691bbef0dded3cf17960'
};
const firebaseApp=initializeApp(firebaseConfig), auth=getAuth(firebaseApp), db=getFirestore(firebaseApp);
const root=document.querySelector('#root');
const stageDefs=[['novo','Novo contato'],['conversa','Em conversa'],['proposta','Proposta enviada'],['followup1','Follow-up 1'],['followup2','Follow-up 2'],['followup3','Follow-up 3'],['fechado','Fechado'],['perdido','Perdido']];
const stageName=id=>stageDefs.find(s=>s[0]===id)?.[1]||'Novo contato';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const spToday=()=>{const p=new Intl.DateTimeFormat('en-GB',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).reduce((a,x)=>(a[x.type]=x.value,a),{});return `${p.year}-${p.month}-${p.day}`};
const plusDays=(date,n)=>{const [y,m,d]=date.split('-').map(Number);return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10)};
const stars=n=>'<span class="stars" aria-label="'+n+' de 5 estrelas">'+('★'.repeat(n||0))+'<span style="color:#d7dce5">'+('★'.repeat(5-(n||0)))+'</span></span>';
let user=null,uid='',account=null,requestedSlug=new URLSearchParams(location.search).get('c')||'',view='Início',layout='kanban',clients=[],taskItems=[],queryText='',stopClients=null,stopTasks=null,clientCursor=null,moreClients=false,loadingClients=false;
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),2600)}
function login(message=''){root.innerHTML=`<div class="login-wrap"><section class="login-card"><div class="brand"><span class="brand-mark">V</span> vértice <span style="font-weight:450;color:#8994a7">crm</span></div><div class="eyebrow" style="margin-top:28px">ESPAÇO DE TRABALHO</div><h1>Entre na sua conta</h1><p class="muted">Acesse seus contatos e acompanhe os próximos retornos.</p><form id="loginForm"><div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><p class="status" role="status">${esc(message)}</p><button class="primary block" type="submit">Entrar</button><button class="text-button block" type="button" data-action="reset">Esqueci minha senha</button></form><div class="demo-hint">Acesso somente por convite. Não há cadastro público nesta tela. Se ainda não recebeu acesso, fale com o administrador da conta.</div></section></div>`}
function head(title,desc,action=''){return `<div class="page-head"><div><div class="eyebrow">${esc(account?.nome||'SEU NEGÓCIO')} · CRM</div><h1>${title}</h1><p>${desc}</p></div>${action?`<button class="primary heading-action" data-action="new-client">＋ Novo cliente</button>`:''}</div>`}
function shell(content){root.innerHTML=`<div class="app-shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">V</span> vértice <span style="font-weight:450;color:#8994a7">crm</span></div><div class="workspace"><span class="avatar">${esc((account?.nome||'V').slice(0,1).toUpperCase())}</span><span class="workspace-copy"><strong>${esc(account?.nome||'Seu negócio')}</strong><small>${esc(account?.plano||'Conta ativa')}</small></span></div><div><div class="nav-label">ESPAÇO DE TRABALHO</div><nav class="nav-list" aria-label="Navegação principal">${[['Início','◫'],['Tarefas de hoje','✓'],['Clientes','♧'],['Conta','⚙']].map(([x,i])=>`<button class="nav-item ${view===x?'active':''}" data-view="${x}"><span class="nav-icon">${i}</span>${x}</button>`).join('')}</nav></div><div class="sidebar-bottom"><div class="side-note">Seus dados do CRM ficam isolados nesta conta e protegidos por regras do Firestore.</div><div class="user-row"><span class="avatar">${esc((user?.email||'V').slice(0,1).toUpperCase())}</span><span class="workspace-copy"><strong>${esc(user?.email||'')}</strong><small>Conta conectada</small></span></div><button class="nav-item" data-action="logout" style="margin-top:8px;width:100%"><span class="nav-icon">↪</span>Sair</button></div></aside><section class="main-col"><header class="topbar"><div class="crumb">${esc(account?.nome||'CRM')} <span style="padding:0 7px;color:#bac2ce">/</span> <strong>${esc(view)}</strong></div><div class="top-actions"><span class="badge">● Conta ativa</span><button class="icon-btn" data-action="logout" aria-label="Sair">↪</button></div></header><section class="page" id="page">${content}</section></section></div><nav class="mobile-nav" aria-label="Navegação móvel">${[['Início','◫'],['Tarefas de hoje','✓'],['Clientes','♧'],['Conta','⚙']].map(([x,i])=>`<button class="${view===x?'active':''}" data-view="${x}"><span>${i}</span>${x==='Tarefas de hoje'?'Tarefas':x}</button>`).join('')}</nav>`}
function clientCollection(){return collection(db,'users',uid,'clients')}
function startLiveFeeds(){stopClients?.();stopTasks?.();clientCursor=null;moreClients=false;const clientsQ=query(clientCollection(),orderBy('dataEntrada','desc'),limit(50));stopClients=onSnapshot(clientsQ,snap=>{clients=snap.docs.map(d=>({id:d.id,...d.data()}));clientCursor=snap.docs.at(-1)||null;moreClients=snap.size===50;if(view==='Clientes'||view==='Início')render()});const tasksQ=query(clientCollection(),where('proximoFollowUp','<=',spToday()),orderBy('proximoFollowUp','asc'),limit(30));stopTasks=onSnapshot(tasksQ,snap=>{taskItems=snap.docs.map(d=>({id:d.id,...d.data()}));if(view==='Tarefas de hoje'||view==='Início')render()})}\nasync function loadMoreClients(){if(loadingClients||!moreClients||!clientCursor)return;loadingClients=true;try{const snap=await getDocs(query(clientCollection(),orderBy('dataEntrada','desc'),startAfter(clientCursor),limit(50)));clients.push(...snap.docs.map(d=>({id:d.id,...d.data()})));clientCursor=snap.docs.at(-1)||clientCursor;moreClients=snap.size===50;render()}catch{toast('Não foi possível carregar mais clientes.')}finally{loadingClients=false}}
async function statData(){const q=query(clientCollection());const closed=query(clientCollection(),where('etapaId','==','fechado'));const [total,won,revenue]=await Promise.all([getCountFromServer(q),getCountFromServer(closed),getAggregateFromServer(q,{amount:sum('valorVenda')})]);return {total:total.data().count,won:won.data().count,revenue:revenue.data().amount||0}}
function metric(label,val,foot,icon){return `<article class="metric"><div class="metric-top"><span>${label}</span><span class="metric-icon">${icon}</span></div><div class="metric-value">${val}</div><div class="metric-foot">${foot}</div></article>`}
function dashboard(){const bars=Array.from({length:7},(_,i)=>`<div class="bar-col"><div class="bar" style="height:${[28,44,35,57,48,72,61][i]}%"></div><span class="bar-label">${['S','T','Q','Q','S','S','D'][i]}</span></div>`).join('');return head('Olá, '+esc((account?.nome||'').split(' ')[0])+' 👋','Seu resumo comercial e os próximos retornos.')+`<div class="metric-grid" id="metrics">${metric('Contatos','…','Consultando seus dados','♧')}${metric('Vendas fechadas','…','Etapa Fechado','✓')}${metric('Conversão','…','Fechados ÷ contatos','◉')}${metric('Faturamento','…','Soma das vendas','＄')}</div><div class="grid-two"><article class="card"><div class="card-head"><div><h2>Atividade da semana</h2><p>Novos contatos cadastrados</p></div></div><div class="chart">${bars}</div></article><article class="card"><div class="card-head"><div><h2>Funil de atendimento</h2><p>Contatos por etapa</p></div><button class="link" data-view="Clientes">Ver clientes</button></div><div class="pipeline">${stageDefs.slice(0,5).map(([id,name])=>{let n=clients.filter(c=>c.etapaId===id).length;return `<div class="pipeline-row"><span>${name}</span><div class="track"><div class="fill" style="width:${Math.min(100,n*16)}%"></div></div><b>${n}</b></div>`}).join('')}</div></article></div><div class="grid-two" style="margin-top:13px"><article class="card"><div class="card-head"><div><h2>Retornos pendentes</h2><p>Hoje ou atrasados</p></div><button class="link" data-view="Tarefas de hoje">Ver tarefas</button></div>${taskItems.slice(0,4).map(taskRow).join('')||'<div class="empty">Nenhum retorno vencido. Que tal cadastrar um novo contato?</div>'}</article><article class="card"><div class="card-head"><div><h2>Seus contatos recentes</h2><p>Atualização em tempo real</p></div><button class="link" data-view="Clientes">Abrir lista</button></div>${clients.slice(0,4).map(c=>`<div class="task-row"><span class="avatar" style="width:27px;height:27px">${esc(c.nome?.slice(0,1)||'C')}</span><div><div class="task-name">${esc(c.nome)}</div><div class="task-desc">${esc(stageName(c.etapaId))}</div></div>${stars(c.estrelas)}</div>`).join('')||'<div class="empty">Sua lista começa com o primeiro contato.</div>'}</article></div>`}
async function loadDashboard(){try{const s=await statData();const conv=s.total?Math.round(s.won/s.total*1000)/10:0;const box=document.querySelector('#metrics');if(box)box.innerHTML=metric('Contatos',s.total,'Total da conta','♧')+metric('Vendas fechadas',s.won,'Etapa Fechado','✓')+metric('Conversão',conv+'%','Fechados ÷ contatos','◉')+metric('Faturamento',new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(s.revenue),'Soma das vendas','＄')}catch{}}
function taskRow(c){const late=c.proximoFollowUp<spToday();return `<div class="task-row ${late?'overdue':''}"><button class="check" data-action="done" data-id="${c.id}" aria-label="Marcar retorno feito"></button><div><div class="task-name">${esc(c.nome)}</div><div class="task-desc">${esc(stageName(c.etapaId))} · ${esc(c.observacao||'Sem observação')}</div></div><div class="task-actions"><button class="small-btn wa" data-action="whatsapp" data-phone="${esc(c.whatsapp||'')}">↗ WhatsApp</button><button class="small-btn reagendar" data-action="reschedule" data-id="${c.id}">Amanhã</button></div></div>`}
function board(){const filtered=clients.filter(c=>(`${c.nome} ${c.observacao||''} ${c.origem||''}`).toLowerCase().includes(queryText.toLowerCase()));return head('Clientes','Organize seus contatos e acompanhe cada conversa.','action')+`<div class="section-tools"><input class="search" id="search" placeholder="⌕  Buscar por nome ou observação" value="${esc(queryText)}"><div class="tabs"><button class="tab ${layout==='kanban'?'active':''}" data-layout="kanban">▦ Kanban</button><button class="tab ${layout==='list'?'active':''}" data-layout="list">☷ Lista</button></div></div>`+(layout==='kanban'?`<div class="kanban">${stageDefs.map(([id,name])=>{const list=filtered.filter(c=>c.etapaId===id);return `<section class="kanban-col"><div class="kanban-head"><span>${name}</span><span>${list.length}</span></div>${list.map(c=>`<article class="k-card"><h3>${esc(c.nome)}</h3><p>${esc(c.observacao||'Sem observação')}</p><div class="k-foot">${stars(c.estrelas)}<span class="follow">${esc(c.proximoFollowUp||'Sem retorno')}</span></div><div class="k-actions"><button class="link" data-action="whatsapp" data-phone="${esc(c.whatsapp||'')}">WhatsApp ↗</button><button class="link" data-action="advance" data-id="${c.id}">Avançar →</button></div></article>`).join('')||'<div class="empty">Nenhum contato</div>'}</section>`}).join('')}</div>`:`<article class="card"><div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Etapa</th><th>Estrelas</th><th>Próximo retorno</th><th>Origem</th><th></th></tr></thead><tbody>${filtered.map(c=>`<tr><td>${esc(c.nome)}</td><td><span class="pill">${esc(stageName(c.etapaId))}</span></td><td>${stars(c.estrelas)}</td><td>${esc(c.proximoFollowUp||'—')}</td><td>${esc(c.origem||'—')}</td><td><button class="link" data-action="delete" data-id="${c.id}">Excluir</button></td></tr>`).join('')}</tbody></table></div>${filtered.length===0?'<div class="empty">Nenhum contato encontrado.</div>':''}\${moreClients?'<div style="text-align:center;padding:12px"><button class="secondary" data-action="more-clients">Carregar mais</button></div>':''}</article>`)}
function tasksPage(){const overdue=taskItems.filter(c=>c.proximoFollowUp<spToday()),today=taskItems.filter(c=>c.proximoFollowUp===spToday());return head('Tarefas de hoje','Retornos atrasados e previstos para hoje.')+`<div class="grid-two"><article class="card"><div class="card-head"><h2 class="${overdue.length?'status':''}">Atrasados · ${overdue.length}</h2></div>${overdue.map(taskRow).join('')||'<div class="empty">Nenhum retorno atrasado.</div>'}<div class="card-head" style="margin-top:18px"><h2>Para hoje · ${today.length}</h2></div>${today.map(taskRow).join('')||'<div class="empty">Nenhum retorno marcado para hoje.</div>'}</article><article class="card"><div class="card-head"><div><h2>Seu ritmo</h2><p>Retornos carregados em tempo real</p></div></div><div class="metric-value">${overdue.length+today.length}</div><p class="muted" style="font-size:10px">Retornos pendentes até hoje.</p><div class="demo-hint">Marcar como feito registra uma interação no histórico do cliente.</div></article></div>`}
function accountPage(){return head('Conta','Dados do seu espaço de trabalho.')+`<div class="grid-two"><article class="card"><div class="card-head"><div><h2>Informações da conta</h2><p>Gerenciadas pelo administrador</p></div></div><div class="task-row" style="grid-template-columns:1fr auto"><span class="muted">Negócio</span><strong>${esc(account?.nome)}</strong></div><div class="task-row" style="grid-template-columns:1fr auto"><span class="muted">Plano</span><strong>${esc(account?.plano||'—')}</strong></div><div class="task-row" style="grid-template-columns:1fr auto"><span class="muted">Acesso até</span><strong>${account?.validadeAte?.toDate?account.validadeAte.toDate().toLocaleDateString('pt-BR'):'—'}</strong></div></article><article class="card"><div class="card-head"><div><h2>Privacidade</h2><p>Controle da sua conta</p></div></div><p class="muted" style="font-size:10px">Os dados do seu CRM são armazenados sob sua conta Firebase e separados dos demais clientes.</p><button class="secondary" data-action="logout">Sair da conta</button></article></div>`}
function adminPage(){return head('Painel master','Acesso administrativo reconhecido.')+`<div class="admin-block"><strong>As ações administrativas estão pausadas neste projeto.</strong><br>O plano Spark não permite implantar as Cloud Functions necessárias para criar, suspender e excluir contas com segurança. Seus dados de CRM continuam disponíveis sob as regras da conta. Quando liberar Cloud Functions, conectamos o painel master sem alterar os dados do cliente.</div>`}
function render(){if(!user)return;let content=view==='Início'?dashboard():view==='Tarefas de hoje'?tasksPage():view==='Clientes'?board():view==='Conta'?accountPage():adminPage();shell(content);if(view==='Início')void loadDashboard()}
function openClientModal(){document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><form class="modal" id="clientForm"><div class="modal-head"><div><div class="eyebrow">NOVO REGISTRO</div><h2>Adicionar cliente</h2></div><button class="close" type="button" data-action="close-modal" aria-label="Fechar">×</button></div><div class="field"><label>Nome</label><input name="nome" maxlength="120" required></div><div class="field"><label>WhatsApp</label><input name="whatsapp" maxlength="30" placeholder="(11) 99999-9999"></div><div class="field"><label>Origem</label><select name="origem"><option>Instagram</option><option>Indicação</option><option>Anúncio</option><option>Outro</option></select></div><div class="field"><label>Classificação</label><select name="estrelas"><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select></div><div class="field"><label>Observação</label><textarea name="observacao" maxlength="4000" rows="3"></textarea></div><div class="field"><label>Próximo follow-up</label><input name="proximoFollowUp" type="date" value="${spToday()}"></div><div class="modal-actions"><button class="secondary" type="button" data-action="close-modal">Cancelar</button><button class="primary" type="submit">Salvar cliente</button></div></form></div>`);const bg=document.querySelector('#modal');bg.querySelectorAll('[data-action="close-modal"]').forEach(b=>b.addEventListener('click',()=>bg.remove()));bg.addEventListener('click',e=>{if(e.target===bg)bg.remove()});document.querySelector('#clientForm').addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));try{await addDoc(clientCollection(),{nome:d.nome.trim(),whatsapp:d.whatsapp.trim(),origem:d.origem,dataEntrada:spToday(),etapaId:'novo',estrelas:Number(d.estrelas),observacao:d.observacao.trim(),proximoFollowUp:d.proximoFollowUp||spToday(),criadoEm:serverTimestamp(),atualizadoEm:serverTimestamp()});bg.remove();toast('Cliente salvo.');view='Clientes';render()}catch{toast('Não foi possível salvar. Confira a conexão e tente novamente.')}})}
async function customerCheck(firebaseUser){user=firebaseUser;if(!user){uid='';account=null;stopClients?.();stopTasks?.();return login()}try{const claims=await user.getIdTokenResult(true);if(claims.claims.admin===true){if(!claims.claims.firebase?.sign_in_second_factor){await signOut(auth);return login('A conta administrativa exige autenticação em dois fatores.')}return adminPageRender()}const snap=await getDoc(doc(db,'accounts',user.uid));if(!snap.exists())throw new Error('no-account');account=snap.data();uid=user.uid;if(account.slug&&requestedSlug&&account.slug!==requestedSlug)throw new Error('wrong-slug');if(account.slug&&!requestedSlug){const u=new URL(location.href);u.searchParams.set('c',account.slug);history.replaceState(null,'',u)}const slug=await getDoc(doc(db,'slugs',account.slug));if(slug.exists()&&slug.data().displayName)account.nome=slug.data().displayName;view='Início';startLiveFeeds();render()}catch{await signOut(auth);return login('Não foi possível entrar. Confira os dados e o link da sua conta.') }}
function adminPageRender(){user=auth.currentUser;root.innerHTML=`<div class="login-wrap"><section class="login-card"><div class="brand"><span class="brand-mark">V</span> vértice <span style="font-weight:450;color:#8994a7">master</span></div><div class="eyebrow" style="margin-top:25px">SESSÃO ADMINISTRATIVA</div><h1>Painel master pausado</h1><div class="admin-block">Esta conta tem acesso administrativo, mas o plano Spark não permite as Cloud Functions que protegem as operações do painel. Nenhuma ação administrativa está disponível nesta versão.</div><button class="secondary block" data-action="logout">Sair</button></section></div>`}
root.addEventListener('submit',async e=>{if(e.target.id==='loginForm'){e.preventDefault();const f=new FormData(e.target);try{await signInWithEmailAndPassword(auth,String(f.get('email')).trim(),String(f.get('password')))}catch{login('Não foi possível entrar. Confira os dados e tente novamente.')}}});
root.addEventListener('input',e=>{if(e.target.id==='search'){queryText=e.target.value;const pos=e.target.selectionStart;render();const x=document.querySelector('#search');x?.focus();x?.setSelectionRange(pos,pos)}});
root.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render();return}if(b.dataset.layout){layout=b.dataset.layout;render();return}const a=b.dataset.action;if(a==='more-clients'){await loadMoreClients();return}if(a==='new-client')openClientModal();else if(a==='logout'){await signOut(auth);login()}else if(a==='reset'){const email=document.querySelector('#email')?.value?.trim();if(!email){toast('Informe seu e-mail primeiro.');return}try{await sendPasswordResetEmail(auth,email);login('Se houver uma conta para esse e-mail, enviaremos as instruções.')}catch{login('Se houver uma conta para esse e-mail, enviaremos as instruções.')}}else if(a==='whatsapp'){const phone=(b.dataset.phone||'').replace(/\D/g,'');if(phone)window.open('https://wa.me/'+phone,'_blank','noopener,noreferrer')}else if(a==='delete'){if(!confirm('Excluir este contato?'))return;try{await deleteDoc(doc(db,'users',uid,'clients',b.dataset.id));toast('Contato excluído.')}catch{toast('Não foi possível excluir o contato.')}}else if(a==='advance'){const c=clients.find(x=>x.id===b.dataset.id);if(!c)return;const i=stageDefs.findIndex(s=>s[0]===c.etapaId);const next=stageDefs[Math.min(i+1,stageDefs.length-1)];try{await updateDoc(doc(db,'users',uid,'clients',c.id),{etapaId:next[0],proximoFollowUp:plusDays(spToday(),3),atualizadoEm:serverTimestamp()});toast('Etapa atualizada; retorno sugerido em 3 dias.')}catch{toast('Não foi possível atualizar a etapa.')}}else if(a==='done'||a==='reschedule'){const c=taskItems.find(x=>x.id===b.dataset.id);if(!c)return;try{if(a==='done'){await addDoc(collection(db,'users',uid,'interactions'),{tipo:'followup_feito',nota:c.observacao||'',data:spToday(),criadoEm:serverTimestamp(),clientId:c.id});await updateDoc(doc(db,'users',uid,'clients',c.id),{proximoFollowUp:deleteField(),atualizadoEm:serverTimestamp()});toast('Retorno registrado.')}else{await updateDoc(doc(db,'users',uid,'clients',c.id),{proximoFollowUp:plusDays(spToday(),1),atualizadoEm:serverTimestamp()});toast('Retorno reagendado para amanhã.')}}catch{toast('Não foi possível atualizar o retorno.')}}});
onAuthStateChanged(auth,customerCheck);
</script></body></html>
